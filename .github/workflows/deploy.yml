name: Deploy Web Application

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # TanStack Start 정적 빌드 및 GitHub Pages subpath 설정 주입
      - name: Build project
        env:
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
          VITE_BASE_URL: /health-companion-ai/
        run: npm run build

      # 빌드 후 생성된 Output 폴더 구조 확인 (디버깅용)
      - name: Check build output directory
        run: |
          if [ -d ".output/public" ]; then
            echo "BUILD_DIR=.output/public" >> $GITHUB_ENV
          elif [ -d "dist/client" ]; then
            echo "BUILD_DIR=dist/client" >> $GITHUB_ENV
          else
            echo "BUILD_DIR=dist" >> $GITHUB_ENV
          fi

      # GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.BUILD_DIR }}
          enable_jekyll: false
