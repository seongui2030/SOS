name: Deploy Web Application

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 22 버전 설정
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. 의존성 패키지 설치
      - name: Install dependencies
        run: npm install

      # 4. 카카오 키 및 Base URL 주입 후 빌드
      - name: Build project
        env:
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
          VITE_KAKAO_REST_API_KEY: ${{ secrets.VITE_KAKAO_REST_API_KEY }}
        run: npm run build

      # 5. TanStack Start / Nitro 정적 파일 경로 자동 감지
      - name: Set publish directory
        run: |
          if [ -d ".output/public" ]; then
            echo "PUBLISH_DIR=.output/public" >> $GITHUB_ENV
          elif [ -d "dist/client" ]; then
            echo "PUBLISH_DIR=dist/client" >> $GITHUB_ENV
          else
            echo "PUBLISH_DIR=dist" >> $GITHUB_ENV
          fi

      # 6. GitHub Pages 배포 (.nojekyll 자동 생성 포함)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUBLISH_DIR }}
          enable_jekyll: false
